version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 5
    versioning-strategy: 'increase-if-necessary'
    # One weekly PR for every npm update, majors included, plus one for security fixes.
    groups:
      npm-all:
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ['*']
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'chore(ci)'
